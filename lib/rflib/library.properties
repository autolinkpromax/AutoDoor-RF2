sentence=A lightweight, noise-filtering RF433 receiver library for SYN480R, EV1527 and PT2262.
paragraph=This library uses standard pin interrupts to decode EV1527 and PT2262 ASK/OOK signals. It includes a built-in software glitch filter to prevent SYN480R high-frequency static noise from flooding the CPU.
