[platformio]
default_envs = esp8285

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<hello_main.cpp>
build_flags =
    -DTAG_ESPNOW_CHANNEL=9
    -DTAG_DEBUG_SERIAL=1
board_build.flash_mode = dout
board_build.f_flash = 26000000L
upload_resetmethod = nodemcu

[env:esp8285-release]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<hello_main.cpp>
build_flags =
    -DTAG_ESPNOW_CHANNEL=9
    -DTAG_DEBUG_SERIAL=0
board_build.flash_mode = dout
board_build.f_flash = 26000000L
upload_resetmethod = nodemcu

[env:esp8285-hello]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<hello_main.cpp> -<main.cpp>
board_build.flash_mode = dout
board_build.f_flash = 26000000L
upload_resetmethod = nodemcu
