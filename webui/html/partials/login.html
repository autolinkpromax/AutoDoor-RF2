<div id="loginGate" class="loginGate hidden" aria-hidden="true">
  <div class="loginCard">
    <h2>เข้าสู่ระบบ</h2>
    <p>กรอกรหัสผ่านเพื่อใช้งาน AutoDoor</p>
    <label>รหัสผ่าน</label>
    <div class="pwWrap">
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" />
      <button type="button" class="pwToggle" data-action="toggle-pw" data-target="loginPass" aria-label="แสดงรหัสผ่าน" title="แสดง/ซ่อน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button type="button" class="btnPri" style="margin-top:14px" data-action="submit-web-login">เข้าสู่ระบบ</button>
    <div class="hint err" id="loginMsg" style="margin-top:10px;min-height:1.2em"></div>
  </div>
</div>
