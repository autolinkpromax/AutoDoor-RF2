[platformio]
default_envs = esp32-c3-release

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions_two_ota.csv
framework = arduino
monitor_speed = 115200
upload_speed = 2000000
lib_deps =
    blynkkk/Blynk@^1.3.2
    bblanchon/ArduinoJson@^7.4.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DAUTODOOR_FEATURE_BUILTIN_MAG=0
extra_scripts =
    pre:scripts/pack_webui.py
    post:scripts/pio_targets.py

[env:esp32-c3-release]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions_two_ota.csv
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    blynkkk/Blynk@^1.3.2
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DAUTODOOR_FEATURE_LOCAL_PANEL=0
    -DAUTODOOR_FEATURE_STATUS_LED=0
    -DAUTODOOR_FEATURE_SAFE_BUTTON_LED=1
    -DAUTODOOR_FEATURE_BUILTIN_MAG=0
extra_scripts =
    pre:scripts/pack_webui.py
    post:scripts/pio_targets.py
